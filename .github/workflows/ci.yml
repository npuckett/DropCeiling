name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: extras/tests/run.sh

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:adafruit_feather_esp32s3_tft
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
              version: 3.3.12
          libraries: |
            - source-path: ./
            - name: Ethernet
            - name: Adafruit GFX Library
            - name: Adafruit ST7735 and ST7789 Library
            - name: Adafruit BusIO
            - source-url: https://github.com/adafruit/Adafruit_DACX578.git
          sketch-paths: |
            - examples
          enable-warnings-report: false
